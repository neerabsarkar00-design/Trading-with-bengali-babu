name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Failed to detect active Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f2)"
          else
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f1 | cut -d- -f1 | cut -d+ -f1)"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '$RAW_VER'"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER ($RAW_VER)"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists."
          else
            if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/keytool" ]; then
              echo "::error::keytool executable not found in configured JAVA_HOME (${JAVA_HOME:-unset})."
              exit 1
            fi
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "::error::Failed to generate temporary debug keystore at ./debug.keystore."
                exit 1
              }
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore ./debug.keystore is missing or empty after generation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release.XXXXXX")"
          DEST_ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"
          cp "$EXPECTED_APK" "$DEST_ASSET_PATH"
          if [ ! -f "$DEST_ASSET_PATH" ] || [ ! -s "$DEST_ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_ASSET_PATH"
            exit 1
          fi
          {
            echo "asset_path=$DEST_ASSET_PATH"
            echo "asset_name=$ASSET_FILENAME"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: $ASSET_FILENAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing or invalid: ${ASSET_PATH:-<empty>}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(printf '%s\n' \
            'This is an automatically generated debug APK.' \
            'The APK was built by GitHub Actions.' \
            "- GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            '- The APK is intended for testing.' \
            '- The APK is not a Play Store production release.' \
            '- The APK is signed only with a temporary debug keystore.')"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: "!cancelled() && steps.prepare_asset.outcome == 'success'"
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Release Asset Filename: $ASSET_NAME"
            {
              echo "## Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo "- **Direct Release Page:** $RELEASE_URL"
              echo ""
              echo "You can download \`$ASSET_NAME\` directly from the **Assets** section on the GitHub Release page above."
              echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Creating the GitHub Release failed, so no release URL was published."
              echo ""
              echo "- The debug APK build **succeeded**."
              echo "- Download the backup APK from the GitHub Actions workflow artifact named **\`app-debug-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
